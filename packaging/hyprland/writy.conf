# Legacy hyprlang example for older supported compositors; merge selectively.
exec-once = systemctl --user import-environment WAYLAND_DISPLAY HYPRLAND_INSTANCE_SIGNATURE XDG_CURRENT_DESKTOP
exec-once = systemctl --user start writy.service
bind = ALT, G, exec, writy search
bind = CTRL ALT, G, exec, writy lookup --selection
bind = CTRL ALT, Return, exec, writy accept
bind = CTRL ALT, W, exec, writy pause
bind = CTRL ALT, P, exec, writy prose
bind = CTRL ALT, S, exec, writy settings
layerrule = noanim, match:namespace ^writy.*$
# Load only a bridge built/tested against this exact compositor:
# exec-once = hyprctl plugin load /usr/lib/writy/writy-hyprland.so
